name: Load Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  load_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Flask app
        run: |
          python app.py &
          sleep 5

      - name: Run locust load test
        run: |
          locust -f locustfile.py --headless -u 50 -r 10 --run-time 1m --host=http://127.0.0.1:5000 --csv=load_report --html=load_report.html

      - name: Check test cases TC-01..TC-03
        run: python check_load.py | tee check_load.txt

      - name: Publish results
        if: always()
        run: python ci_summary.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-report
          path: |
            load_report_*.csv
            load_report.html
            check_load.txt

      - name: Save reports to ci-reports branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash save_reports.sh load-test load_report_stats.csv load_report_failures.csv load_report_exceptions.csv load_report_stats_history.csv load_report.html check_load.txt
